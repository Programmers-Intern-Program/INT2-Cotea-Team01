name: Backend CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Test
        run: ./gradlew test

      - name: Build jar
        run: ./gradlew clean bootJar

  deploy-ec2:
    name: Deploy on EC2
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
      DEPLOY_DIR: ${{ vars.EC2_DEPLOY_DIR || '/home/ubuntu/INT2-Cotea-Team01' }}
      SERVICE_NAME: ${{ vars.EC2_SERVICE_NAME || 'cotea-backend' }}
      SPRING_PROFILE: ${{ vars.SPRING_PROFILE || 'prod' }}
      REPOSITORY_URL: ${{ vars.REPOSITORY_URL || 'https://github.com/Programmers-Intern-Program/INT2-Cotea-Team01.git' }}
      DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || 'main' }}

    steps:
      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "EC2_SSH_PRIVATE_KEY secret is required."
            exit 1
          fi
          if [ -z "${EC2_HOST}" ]; then
            echo "EC2_HOST repository variable is required."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts

      - name: Pull, build, and restart on EC2
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ec2_key "${EC2_USER}@${EC2_HOST}" \
            "DEPLOY_DIR='${DEPLOY_DIR}' SERVICE_NAME='${SERVICE_NAME}' SPRING_PROFILE='${SPRING_PROFILE}' REPOSITORY_URL='${REPOSITORY_URL}' DEPLOY_BRANCH='${DEPLOY_BRANCH}' bash -s" <<'EOF'
          set -euo pipefail

          if [ ! -d "${DEPLOY_DIR}/.git" ]; then
            mkdir -p "$(dirname "${DEPLOY_DIR}")"
            git clone --branch "${DEPLOY_BRANCH}" "${REPOSITORY_URL}" "${DEPLOY_DIR}"
          fi

          cd "${DEPLOY_DIR}"
          git fetch origin "${DEPLOY_BRANCH}"
          git checkout "${DEPLOY_BRANCH}"
          git pull --ff-only origin "${DEPLOY_BRANCH}"

          cd backend
          chmod +x ./gradlew
          ./gradlew clean bootJar

          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name 'cotea-backend-*.jar' ! -name '*-plain.jar' | sort | head -n 1)"
          if [ -z "${JAR_PATH}" ]; then
            echo "Executable Spring Boot jar was not found under build/libs."
            exit 1
          fi
          JAR_PATH="$(readlink -f "${JAR_PATH}")"

          if ! command -v nginx > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y nginx
          fi

          BLUE_PORT=8081
          GREEN_PORT=8082
          PROXY_PORT=8080
          ACTIVE_PORT_FILE="${DEPLOY_DIR}/backend/.active-port"

          ACTIVE_PORT=""
          if [ -f "${ACTIVE_PORT_FILE}" ]; then
            ACTIVE_PORT="$(cat "${ACTIVE_PORT_FILE}")"
          fi

          if [ "${ACTIVE_PORT}" = "${BLUE_PORT}" ]; then
            NEXT_PORT="${GREEN_PORT}"
          else
            NEXT_PORT="${BLUE_PORT}"
          fi

          echo "Active port: ${ACTIVE_PORT:-none}; next port: ${NEXT_PORT}"

          pkill -f "cotea-backend-.*\\.jar.*server.port=${NEXT_PORT}" || true
          for _ in $(seq 1 10); do
            if ! pgrep -f "cotea-backend-.*\\.jar.*server.port=${NEXT_PORT}" > /dev/null; then
              break
            fi
            sleep 1
          done

          nohup env SPRING_PROFILES_ACTIVE="${SPRING_PROFILE}" java -jar "${JAR_PATH}" \
            --server.port="${NEXT_PORT}" \
            > "${DEPLOY_DIR}/backend/application-${NEXT_PORT}.log" 2>&1 &
          NEW_PID=$!

          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 3 "http://localhost:${NEXT_PORT}"; then
              echo "New backend is healthy on port ${NEXT_PORT}."
              break
            fi
            sleep 2
          done

          if ! curl --fail --silent --show-error --max-time 3 "http://localhost:${NEXT_PORT}" > /dev/null; then
            echo "New backend did not become healthy on port ${NEXT_PORT}."
            tail -n 120 "${DEPLOY_DIR}/backend/application-${NEXT_PORT}.log" || true
            kill "${NEW_PID}" || true
            exit 1
          fi

          sudo tee /etc/nginx/conf.d/cotea-backend.conf > /dev/null <<NGINX_CONF
          server {
              listen ${PROXY_PORT};
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:${NEXT_PORT};
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          NGINX_CONF

          # First migration from direct 8080 jar to nginx: free the proxy port
          # after the new backend is already healthy.
          if [ -z "${ACTIVE_PORT}" ]; then
            for pid in $(pgrep -f "java -jar .*cotea-backend-.*\\.jar" || true); do
              if [ "${pid}" != "${NEW_PID}" ]; then
                kill "${pid}" || true
              fi
            done
            sleep 2
          fi

          sudo nginx -t
          sudo systemctl enable nginx
          if systemctl is-active --quiet nginx; then
            sudo systemctl reload nginx
          else
            sudo systemctl start nginx
          fi

          curl --fail --silent --show-error --max-time 10 "http://localhost:${PROXY_PORT}"
          echo "${NEXT_PORT}" > "${ACTIVE_PORT_FILE}"

          if [ -n "${ACTIVE_PORT}" ] && [ "${ACTIVE_PORT}" != "${NEXT_PORT}" ]; then
            pkill -f "cotea-backend-.*\\.jar.*server.port=${ACTIVE_PORT}" || true
          fi

          echo "Blue-Green deployment completed. Active port is now ${NEXT_PORT}."
          EOF
